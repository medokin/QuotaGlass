name: Build

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - version.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" \
            | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan Git history
        shell: bash
        run: '"${RUNNER_TEMP}/gitleaks" git . --no-banner --redact'

  build:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ReservePane.slnx
          dotnet restore src/ReservePane.Installer/ReservePane.Installer.wixproj

      - name: Build
        run: dotnet build ReservePane.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ReservePane.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish src/ReservePane/ReservePane.csproj -c Release -p:PublishProfile=win-x64 -o artifacts/ReservePane-win-x64

      - name: Verify published artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/ReservePane-win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ReservePane.exe') {
            throw "Expected only ReservePane.exe, found: $($files.Name -join ', ')"
          }

      - name: Publish MSI lifecycle payloads
        shell: pwsh
        run: |
          foreach ($version in @('0.0.1', '0.0.2')) {
            dotnet publish src/ReservePane/ReservePane.csproj `
              -c Release `
              --no-restore `
              -p:PublishProfile=win-x64-self-contained `
              -p:Version=$version `
              -p:FileVersion=$version.0 `
              -p:InformationalVersion=$version `
              -p:IncludeSourceRevisionInInformationalVersion=false `
              -o "artifacts/ReservePane-msi-payload-$version"
          }

      - name: Build MSI lifecycle packages
        shell: pwsh
        run: |
          foreach ($version in @('0.0.1', '0.0.2')) {
            dotnet build src/ReservePane.Installer/ReservePane.Installer.wixproj `
              -c Release `
              --no-restore `
              -p:MsiVersion=$version `
              -p:PayloadDir="$pwd/artifacts/ReservePane-msi-payload-$version" `
              -p:OutputPath="$pwd/artifacts/msi-$version/"
          }

      - name: Test MSI metadata and lifecycle
        shell: pwsh
        run: |
          ./eng/installer/Test-MsiLifecycle.ps1 `
            -BaseMsiPath artifacts/msi-0.0.1/ReservePane-v0.0.1-win-x64.msi `
            -BaseVersion 0.0.1 `
            -UpgradeMsiPath artifacts/msi-0.0.2/ReservePane-v0.0.2-win-x64.msi `
            -UpgradeVersion 0.0.2

      - name: Upload application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReservePane-win-x64
          path: artifacts/ReservePane-win-x64/ReservePane.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReservePane-msi-win-x64
          path: artifacts/msi-0.0.2/ReservePane-v0.0.2-win-x64.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
