name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release Please tag to rebuild and finalize
        required: true
        type: string

permissions: {}

concurrency:
  group: release-please-master
  cancel-in-progress: false

jobs:
  release_please:
    name: Manage release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      publish_required: ${{ steps.metadata.outputs.publish_required }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      version: ${{ steps.metadata.outputs.version }}
      major: ${{ steps.metadata.outputs.major }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: master

      - name: Queue checks for the Release Please pull request
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          release_branch='release-please--branches--master--components--QuotaGlass'
          if jq -e 'length == 1' <<<"${RELEASE_PRS:-[]}" >/dev/null; then
            release_prs="${RELEASE_PRS}"
          else
            release_prs="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=master&per_page=100" \
                --slurp \
                | jq -c \
                  --arg repo "${GITHUB_REPOSITORY}" \
                  --arg branch "${release_branch}" \
                  '[.[][] | select(
                    .head.repo.full_name == $repo and
                    .head.ref == $branch and
                    .base.ref == "master" and
                    (.title | test("^chore\\(release\\): release [0-9]+\\.[0-9]+\\.[0-9]+$")) and
                    any(.labels[]?; .name == "autorelease: pending")
                  ) | {number, headBranchName: .head.ref}]'
            )"
          fi

          if jq -e 'length == 0' <<<"${release_prs}" >/dev/null; then
            echo 'No open Release Please pull request requires checks.'
            exit 0
          fi

          if ! jq -e 'length == 1' <<<"${release_prs}" >/dev/null; then
            echo 'Expected exactly one Release Please pull request.' >&2
            exit 1
          fi

          pr_number="$(jq -er '.[0].number' <<<"${release_prs}")"
          expected_branch="$(jq -er '.[0].headBranchName' <<<"${release_prs}")"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          title="$(jq -r '.title' <<<"${pr_json}")"
          body="$(jq -r '.body // ""' <<<"${pr_json}")"
          head_branch="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"

          if [[ "$(jq -r '.base.ref' <<<"${pr_json}")" != 'master' ||
                "$(jq -r '.head.repo.full_name' <<<"${pr_json}")" != "${GITHUB_REPOSITORY}" ||
                "${head_branch}" != "${expected_branch}" ]]; then
            echo 'Release Please pull request targets an unexpected repository or branch.' >&2
            exit 1
          fi

          if [[ ! "${title}" =~ ^chore\(release\):\ release\ [0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Release Please pull request title: ${title}" >&2
            exit 1
          fi

          if grep -Eiq '(Release-As:|BEGIN_COMMIT_OVERRIDE|END_COMMIT_OVERRIDE)' <<<"${body}"; then
            echo 'Release Please pull request body contains a control marker.' >&2
            exit 1
          fi

          actual_files="$({
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
              --jq '.[].filename'
          } | sort)"
          expected_files="$(printf '%s\n' \
            '.release-please-manifest.json' \
            'CHANGELOG.md' \
            'version.txt' | sort)"
          if [[ "${actual_files}" != "${expected_files}" ]]; then
            echo 'Release Please pull request contains unexpected files.' >&2
            printf '%s\n' "${actual_files}" >&2
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Validate PR title' \
            -f head_sha="${head_sha}" \
            -f status='completed' \
            -f conclusion='success' \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f 'output[title]=Release pull request metadata is valid' \
            -f 'output[summary]=Release Please generated the expected Conventional Commit title, body, and files.' \
            >/dev/null

          build_workflow_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml" \
              --jq '.id'
          )"
          dispatch_json="$(
            gh api --method POST \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
              -F ref="${head_branch}" \
              -F return_run_details=true
          )"
          build_run_id="$(jq -er '.workflow_run_id' <<<"${dispatch_json}")"

          gh run watch "${build_run_id}" --exit-status --interval 10
          build_run_json="$(
            gh run view "${build_run_id}" \
              --json conclusion,event,headBranch,headSha,jobs,url,workflowDatabaseId,workflowName
          )"

          if [[ "$(jq -r '.conclusion' <<<"${build_run_json}")" != 'success' ||
                "$(jq -r '.event' <<<"${build_run_json}")" != 'workflow_dispatch' ||
                "$(jq -r '.headBranch' <<<"${build_run_json}")" != "${head_branch}" ||
                "$(jq -r '.headSha' <<<"${build_run_json}")" != "${head_sha}" ||
                "$(jq -r '.workflowDatabaseId' <<<"${build_run_json}")" != "${build_workflow_id}" ||
                "$(jq -r '.workflowName' <<<"${build_run_json}")" != 'Build' ]]; then
            echo 'Dispatched build did not succeed on the expected pull request commit.' >&2
            exit 1
          fi

          actual_jobs="$(jq -r '.jobs[].name' <<<"${build_run_json}" | sort)"
          expected_jobs="$(printf '%s\n' \
            'Build, test, and publish' \
            'Secret scan' | sort)"
          if [[ "${actual_jobs}" != "${expected_jobs}" ]]; then
            echo 'Dispatched build returned an unexpected job set.' >&2
            printf '%s\n' "${actual_jobs}" >&2
            exit 1
          fi

          create_required_check() {
            local check_name="$1"
            local job_url
            job_url="$(
              jq -er --arg name "${check_name}" \
                '.jobs[] | select(.name == $name and .conclusion == "success") | .url' \
                <<<"${build_run_json}"
            )"

            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="${check_name}" \
              -f head_sha="${head_sha}" \
              -f status='completed' \
              -f conclusion='success' \
              -f details_url="${job_url}" \
              -f 'output[title]=Dispatched release pull request check passed' \
              -f "output[summary]=The trusted build workflow passed ${check_name} on ${head_sha}." \
              >/dev/null
          }

          create_required_check 'Secret scan'
          create_required_check 'Build, test, and publish'

      - name: Check out master for recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate draft release recovery
        id: recovery
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          manifest_version="$(jq -er '.["."]' .release-please-manifest.json)"
          expected_tag="v${manifest_version}"
          if [[ "${INPUT_TAG}" != "${expected_tag}" ]]; then
            echo "Recovery tag must be ${expected_tag}, not ${INPUT_TAG}." >&2
            exit 1
          fi

          release_json="$(
            gh release view "${INPUT_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,tagName,targetCommitish
          )"
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != 'true' ]]; then
            echo "Release ${INPUT_TAG} is not a draft." >&2
            exit 1
          fi
          if [[ "$(jq -r '.tagName' <<<"${release_json}")" != "${INPUT_TAG}" ]]; then
            echo "Release tag does not match ${INPUT_TAG}." >&2
            exit 1
          fi

          release_target="$(jq -r '.targetCommitish' <<<"${release_json}")"
          tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${INPUT_TAG}" \
              --jq '.object.sha'
          )"
          if [[ "${tag_sha}" != "${release_target}" ]]; then
            echo "Release tag ${INPUT_TAG} moved from ${release_target} to ${tag_sha}." >&2
            exit 1
          fi

          release_sha="$(git rev-parse "${release_target}^{commit}")"
          if [[ "${release_sha}" != "${release_target}" ]]; then
            echo "Release target ${release_target} is not a commit SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_sha}" origin/master; then
            echo "Release tag ${INPUT_TAG} is not contained in master." >&2
            exit 1
          fi

          echo "publish_required=true" >>"${GITHUB_OUTPUT}"
          echo "tag_name=${INPUT_TAG}" >>"${GITHUB_OUTPUT}"
          echo "version=${manifest_version}" >>"${GITHUB_OUTPUT}"
          echo "major=${manifest_version%%.*}" >>"${GITHUB_OUTPUT}"
          echo "sha=${release_sha}" >>"${GITHUB_OUTPUT}"

      - name: Normalize release metadata
        id: metadata
        shell: bash
        env:
          ACTION_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_TAG: ${{ steps.release.outputs.tag_name }}
          ACTION_VERSION: ${{ steps.release.outputs.version }}
          ACTION_MAJOR: ${{ steps.release.outputs.major }}
          ACTION_SHA: ${{ steps.release.outputs.sha }}
          RECOVERY_CREATED: ${{ steps.recovery.outputs.publish_required }}
          RECOVERY_TAG: ${{ steps.recovery.outputs.tag_name }}
          RECOVERY_VERSION: ${{ steps.recovery.outputs.version }}
          RECOVERY_MAJOR: ${{ steps.recovery.outputs.major }}
          RECOVERY_SHA: ${{ steps.recovery.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            publish_required="${ACTION_CREATED:-false}"
            tag_name="${ACTION_TAG:-}"
            version="${ACTION_VERSION:-}"
            major="${ACTION_MAJOR:-}"
            sha="${ACTION_SHA:-}"
          else
            publish_required="${RECOVERY_CREATED:-false}"
            tag_name="${RECOVERY_TAG:-}"
            version="${RECOVERY_VERSION:-}"
            major="${RECOVERY_MAJOR:-}"
            sha="${RECOVERY_SHA:-}"
          fi

          if [[ "${publish_required}" != 'true' ]]; then
            publish_required=false
            tag_name=''
            version=''
            major=''
            sha=''
          elif [[ -z "${tag_name}" || -z "${version}" || -z "${major}" || -z "${sha}" ]]; then
            echo 'Release metadata is incomplete.' >&2
            exit 1
          fi

          echo "publish_required=${publish_required}" >>"${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "major=${major}" >>"${GITHUB_OUTPUT}"
          echo "sha=${sha}" >>"${GITHUB_OUTPUT}"

  package:
    name: Build, test, and package
    needs: release_please
    if: needs.release_please.outputs.publish_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
      RELEASE_MAJOR: ${{ needs.release_please.outputs.major }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore QuotaGlass.slnx

      - name: Build
        shell: pwsh
        run: |
          $versionProperties = @(
              "-p:Version=$env:RELEASE_VERSION"
              "-p:AssemblyVersion=$env:RELEASE_MAJOR.0.0.0"
              "-p:FileVersion=$env:RELEASE_VERSION.0"
              "-p:InformationalVersion=$env:RELEASE_VERSION"
              '-p:IncludeSourceRevisionInInformationalVersion=false'
          )
          dotnet build QuotaGlass.slnx -c Release --no-restore @versionProperties

      - name: Test
        run: dotnet test QuotaGlass.slnx -c Release --no-build

      - name: Publish
        shell: pwsh
        run: |
          $versionProperties = @(
              "-p:Version=$env:RELEASE_VERSION"
              "-p:AssemblyVersion=$env:RELEASE_MAJOR.0.0.0"
              "-p:FileVersion=$env:RELEASE_VERSION.0"
              "-p:InformationalVersion=$env:RELEASE_VERSION"
              '-p:IncludeSourceRevisionInInformationalVersion=false'
          )
          dotnet publish src/QuotaGlass/QuotaGlass.csproj `
              -c Release `
              --no-restore `
              -p:PublishProfile=win-x64 `
              -o artifacts/QuotaGlass-win-x64 `
              @versionProperties

      - name: Verify and package release
        shell: pwsh
        run: |
          $expectedAssemblyVersion = "$env:RELEASE_MAJOR.0.0.0"
          $expectedFileVersion = "$env:RELEASE_VERSION.0"
          $assemblyPath = Resolve-Path `
              'src/QuotaGlass/bin/Release/net10.0-windows10.0.19041.0/win-x64/QuotaGlass.dll'
          $publishDirectory = Resolve-Path 'artifacts/QuotaGlass-win-x64'
          $executablePath = Join-Path $publishDirectory 'QuotaGlass.exe'

          $assemblyName = [Reflection.AssemblyName]::GetAssemblyName($assemblyPath)
          if ($assemblyName.Version.ToString() -ne $expectedAssemblyVersion) {
              throw "AssemblyVersion must be $expectedAssemblyVersion, found $($assemblyName.Version)."
          }

          $assemblyInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($assemblyPath)
          if ($assemblyInfo.FileVersion -ne $expectedFileVersion) {
              throw "DLL FileVersion must be $expectedFileVersion, found $($assemblyInfo.FileVersion)."
          }
          if ($assemblyInfo.ProductVersion -ne $env:RELEASE_VERSION) {
              throw "DLL ProductVersion must be $env:RELEASE_VERSION, found $($assemblyInfo.ProductVersion)."
          }

          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDirectory -File -Recurse)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].FullName -ne $executablePath) {
              throw "Expected only QuotaGlass.exe, found: $($publishedFiles.FullName -join ', ')"
          }

          $executableInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($executablePath)
          if ($executableInfo.FileVersion -ne $expectedFileVersion) {
              throw "EXE FileVersion must be $expectedFileVersion, found $($executableInfo.FileVersion)."
          }
          if ($executableInfo.ProductVersion -ne $env:RELEASE_VERSION) {
              throw "EXE ProductVersion must be $env:RELEASE_VERSION, found $($executableInfo.ProductVersion)."
          }

          $releaseDirectory = New-Item -ItemType Directory -Path artifacts/release -Force
          $archiveName = "QuotaGlass-$env:RELEASE_TAG-win-x64.zip"
          $checksumName = "QuotaGlass-$env:RELEASE_TAG-win-x64.sha256"
          $archivePath = Join-Path $releaseDirectory $archiveName
          $checksumPath = Join-Path $releaseDirectory $checksumName

          Compress-Archive `
              -LiteralPath $executablePath `
              -DestinationPath $archivePath `
              -CompressionLevel Optimal

          $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
              if ($archive.Entries.Count -ne 1 -or
                  $archive.Entries[0].FullName -ne 'QuotaGlass.exe') {
                  throw "ZIP must contain only QuotaGlass.exe, found: $($archive.Entries.FullName -join ', ')"
              }
          }
          finally {
              $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
              $checksumPath,
              "$hash  $archiveName`n",
              [Text.UTF8Encoding]::new($false))

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuotaGlass-${{ needs.release_please.outputs.tag_name }}-release
          path: |
            artifacts/release/QuotaGlass-${{ needs.release_please.outputs.tag_name }}-win-x64.zip
            artifacts/release/QuotaGlass-${{ needs.release_please.outputs.tag_name }}-win-x64.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  finalize:
    name: Publish GitHub Release
    needs:
      - release_please
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release_please.outputs.sha }}
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaGlass-${{ needs.release_please.outputs.tag_name }}-release
          path: artifacts/release

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail

          archive="QuotaGlass-${RELEASE_TAG}-win-x64.zip"
          checksum="QuotaGlass-${RELEASE_TAG}-win-x64.sha256"
          cd artifacts/release
          sha256sum --check "${checksum}"
          mapfile -t entries < <(unzip -Z1 "${archive}")
          if [[ "${#entries[@]}" -ne 1 || "${entries[0]}" != 'QuotaGlass.exe' ]]; then
            echo "ZIP must contain only QuotaGlass.exe: ${entries[*]}" >&2
            exit 1
          fi

      - name: Attach assets and publish draft
        shell: bash
        run: |
          set -euo pipefail

          verify_release_target() {
            local release_target
            local tag_sha
            release_target="$(jq -r '.targetCommitish' <<<"${release_json}")"
            tag_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
                --jq '.object.sha'
            )"
            if [[ "${release_target}" != "${RELEASE_SHA}" || \
                  "${tag_sha}" != "${RELEASE_SHA}" ]]; then
              echo "Release target ${release_target} and tag target ${tag_sha} must equal packaged SHA ${RELEASE_SHA}." >&2
              exit 1
            fi
          }

          release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets,isDraft,tagName,targetCommitish
          )"
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != 'true' ]]; then
            echo "Release ${RELEASE_TAG} is not a draft." >&2
            exit 1
          fi
          verify_release_target

          archive="QuotaGlass-${RELEASE_TAG}-win-x64.zip"
          checksum="QuotaGlass-${RELEASE_TAG}-win-x64.sha256"
          compare_root="${RUNNER_TEMP}/release-assets"
          mkdir -p "${compare_root}"

          for asset_name in "${archive}" "${checksum}"; do
            asset_path="artifacts/release/${asset_name}"
            if jq -e --arg name "${asset_name}" \
              'any(.assets[]; .name == $name)' <<<"${release_json}" >/dev/null; then
              download_directory="${compare_root}/${asset_name}"
              mkdir -p "${download_directory}"
              gh release download "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${asset_name}" \
                --dir "${download_directory}"
              local_hash="$(sha256sum "${asset_path}" | cut -d' ' -f1)"
              remote_hash="$(sha256sum "${download_directory}/${asset_name}" | cut -d' ' -f1)"
              if [[ "${local_hash}" != "${remote_hash}" ]]; then
                echo "Existing asset ${asset_name} differs from the candidate." >&2
                exit 1
              fi
            else
              gh release upload "${RELEASE_TAG}" "${asset_path}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
          done

          release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets,isDraft,tagName,targetCommitish
          )"
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != 'true' ]]; then
            echo "Release ${RELEASE_TAG} is no longer a draft." >&2
            exit 1
          fi
          verify_release_target

          mapfile -t actual_assets < <(
            jq -r '.assets[].name' <<<"${release_json}" | LC_ALL=C sort
          )
          mapfile -t expected_assets < <(
            printf '%s\n' "${archive}" "${checksum}" | LC_ALL=C sort
          )
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "Unexpected release assets: ${actual_assets[*]}" >&2
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

          release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isImmutable,tagName,targetCommitish
          )"
          verify_release_target
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != 'false' || \
                "$(jq -r '.isImmutable' <<<"${release_json}")" != 'true' ]]; then
            echo "Release ${RELEASE_TAG} was not published immutably." >&2
            exit 1
          fi
